  <!-- ================= SPONGEBOB ================= -->

          <ellipse cx="114" cy="170" rx="9" ry="14" fill="url(#sbzSkin)"/>

          <ellipse cx="150" cy="56" rx="16" ry="9" fill="url(#sbzSkin)"/>

          <!-- sponge body -->
          <rect x="115" y="55" width="190" height="232" rx="18" fill="url(#sbzSkin)" stroke="#7a5c00" stroke-width="3"/>
          <!-- porous texture -->
          <rect x="115" y="55" width="190" height="232" rx="18" filter="url(#sbzNoise)" opacity=".35"/>

          <!-- sponge holes -->

            <circle cx="140" cy="82" r="8" fill="#cfa021"/><ellipse cx="138" cy="80" rx="5" ry="4" fill="#a87c14"/>

            <circle cx="211" cy="68" r="6" fill="#cfa021"/><ellipse cx="209.5" cy="66" rx="3.5" ry="3" fill="#a87c14"/>

          <!-- shirt + pants -->

          <line x1="274" y1="311" x2="274" y2="353" stroke="#5d3413" stroke-width="3"/>
          <!-- collar -->
          <polygon points="192,288 210,288 201,301" fill="#fff" stroke="#9aa" stroke-width="1.5"/>
          <polygon points="228,288 210,288 219,301" fill="#fff" stroke="#9aa" stroke-width="1.5"/>
          <!-- tie -->
          <g class="sbz-tie">
            <polygon points="203,291 217,291 210,301" fill="#e02222" stroke="#8e0f0f" stroke-width="2"/>
            <polygon points="210,299 221,318 210,342 199,318" fill="#e02222" stroke="#8e0f0f" stroke-width="2"/>
          </g>

          <!-- ===== FACE ===== -->
          <!-- cheeks + freckles -->
          <circle cx="150" cy="196" r="17" fill="url(#sbzCheek)"/>
          <circle cx="270" cy="196" r="17" fill="url(#sbzCheek)"/>
          <circle cx="146" cy="192" r="1.8" fill="#c98a12"/>
          <circle cx="154" cy="199" r="1.8" fill="#c98a12"/>
          <circle cx="145" cy="201" r="1.8" fill="#c98a12"/>
          <circle cx="274" cy="192" r="1.8" fill="#c98a12"/>
          <circle cx="266" cy="199" r="1.8" fill="#c98a12"/>
          <circle cx="275" cy="201" r="1.8" fill="#c98a12"/>

          <!-- eyes -->
          <g class="sbz-eye sbz-eyeL">
            <ellipse cx="178" cy="140" rx="31" ry="33" fill="#fff" stroke="#7a5c00" stroke-width="3"/>
            <circle class="sbz-pupil" cx="184" cy="142" r="13" fill="#5ab4e5"/>
            <circle class="sbz-pupil" cx="184" cy="142" r="6.5" fill="#101010"/>
            <circle class="sbz-pupil" cx="187" cy="138" r="2.6" fill="#fff"/>
            <path d="M160 112 l-8 -12 M172 108 l-3 -14 M186 108 l4 -13" stroke="#101010" stroke-width="3.5" stroke-linecap="round"/>
          </g>
          <g class="sbz-eye sbz-eyeR">
            <ellipse cx="242" cy="140" rx="31" ry="33" fill="#fff" stroke="#7a5c00" stroke-width="3"/>
            <circle class="sbz-pupil" cx="236" cy="142" r="13" fill="#5ab4e5"/>

          <!-- nose -->
          <g class="sbz-nose">
            <ellipse cx="210" cy="183" rx="7.5" ry="18" fill="url(#sbzSkin)" stroke="#7a5c00" stroke-width="2.5"/>

          <!-- mouth: big grin + buck teeth -->

<style>
  .sbz-stage{position:relative;width:100%;max-width:540px;height:620px;margin:0 auto;
    overflow:hidden;border-radius:22px;
    background:radial-gradient(ellipse at 50% -10%,#1a7db0 0%,#0d5a8c 45%,#083e66 78%,#062c4e 100%);
    box-shadow:0 22px 60px rgba(0,20,40,.45), inset 0 0 120px rgba(0,10,30,.35);
    font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none}

  /* underwater light rays */
  .sbz-ray{position:absolute;top:-15%;width:26%;height:80%;
    background:linear-gradient(to bottom,rgba(190,235,255,.28),rgba(190,235,255,0));
    filter:blur(6px);transform-origin:top center;pointer-events:none}
  .sbz-ray1{left:14%;transform:rotate(14deg);animation:sbzRay 7s ease-in-out infinite alternate}
  .sbz-ray2{right:12%;transform:rotate(-16deg);animation:sbzRay 9s ease-in-out infinite alternate-reverse}
  @keyframes sbzRay{from{opacity:.35;transform:rotate(12deg)}to{opacity:.8;transform:rotate(18deg)}}

  /* disco beams */
  .sbz-beam{position:absolute;top:-30%;left:50%;width:150%;height:160%;margin-left:-75%;
    mix-blend-mode:screen;pointer-events:none;transform-origin:50% 20%;opacity:.6}
  .sbz-beamL{background:conic-gradient(from 200deg at 50% 20%,transparent 0 12%,rgba(255,60,180,.5) 15%,transparent 20%,transparent 40%,rgba(60,255,190,.45) 45%,transparent 50%);
    animation:sbzSpin 6s linear infinite}
  .sbz-beamR{background:conic-gradient(from 40deg at 50% 20%,transparent 0 10%,rgba(80,140,255,.5) 14%,transparent 19%,transparent 55%,rgba(255,230,80,.45) 60%,transparent 66%);
    animation:sbzSpin 8s linear infinite reverse}
  @keyframes sbzSpin{to{transform:rotate(360deg)}}

  /* sand floor */
  .sbz-floor{position:absolute;bottom:0;left:-5%;width:110%;height:96px;
    background:linear-gradient(#e8c47c,#c79b52 60%,#a97f3d);
    border-radius:100% 100% 0 0/60px 60px 0 0;
    box-shadow:inset 0 8px 14px rgba(255,240,200,.5)}
  .sbz-glow{position:absolute;bottom:28px;left:50%;width:420px;height:120px;transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(255,120,220,.35),transparent 65%);
    animation:sbzHue 5s linear infinite;pointer-events:none;mix-blend-mode:screen}
  @keyframes sbzHue{to{filter:hue-rotate(360deg)}}

  /* bubbles */
  .sbz-bub{position:absolute;bottom:-30px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.85) 0 18%,rgba(190,230,255,.28) 45%,rgba(150,210,255,.12) 100%);
    border:1px solid rgba(220,245,255,.5);animation:sbzRise linear infinite;pointer-events:none}
  .b1{left:8%;width:16px;height:16px;animation-duration:7s}
  .b2{left:22%;width:9px;height:9px;animation-duration:5.5s;animation-delay:1.2s}
  .b3{left:55%;width:12px;height:12px;animation-duration:6.4s;animation-delay:2.8s}
  .b4{left:72%;width:18px;height:18px;animation-duration:8s;animation-delay:.6s}
  .b5{left:88%;width:10px;height:10px;animation-duration:5s;animation-delay:3.4s}
  .b6{left:38%;width:7px;height:7px;animation-duration:6s;animation-delay:4.2s}
  @keyframes sbzRise{
    0%{transform:translate(0,0);opacity:0}
    8%{opacity:1}
    50%{transform:translate(14px,-46vh)}
    100%{transform:translate(-8px,-92vh);opacity:0}}

  /* music notes */
  .sbz-note{position:absolute;font-size:30px;color:#fff;text-shadow:0 0 12px rgba(120,220,255,.9);
    opacity:0;animation:sbzNote 3.2s ease-out infinite;pointer-events:none}
  .n1{left:16%;bottom:44%;animation-delay:0s;color:#ffd75e}
  .n2{left:78%;bottom:48%;animation-delay:.8s;color:#7ef0c9}
  .n3{left:26%;bottom:58%;animation-delay:1.6s;color:#ff9de2}
  .n4{left:68%;bottom:60%;animation-delay:2.4s;color:#8fc3ff}
  @keyframes sbzNote{
    0%{opacity:0;transform:translateY(18px) rotate(-14deg) scale(.7)}
    18%{opacity:1}
    100%{opacity:0;transform:translateY(-110px) rotate(16deg) scale(1.25)}}

  /* ground shadow (squashes opposite the bounce) */
  .sbz-shadow{position:absolute;bottom:44px;left:50%;width:230px;height:34px;transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(0,15,35,.55),transparent 68%);
    animation:sbzShadow .46s ease-in-out infinite alternate}
  @keyframes sbzShadow{from{transform:translateX(-50%) scale(1.08)}to{transform:translateX(-50%) scale(.72);opacity:.55}}

  /* ============ THE DANCE ============ */
  .sbz-bob{position:absolute;bottom:8px;left:50%;width:330px;margin-left:-165px;overflow:visible}

  .sbz-sway{transform-origin:210px 460px;animation:sbzSway 1.84s ease-in-out infinite}
  @keyframes sbzSway{
    0%,100%{transform:rotate(-5deg) translateX(-10px)}
    50%{transform:rotate(5deg) translateX(10px)}}

  .sbz-bounce{transform-origin:210px 460px;animation:sbzBounce .46s ease-in-out infinite alternate}
  @keyframes sbzBounce{
    from{transform:translateY(0) scale(1.05,.93)}
    to{transform:translateY(-30px) scale(.97,1.05)}}

  .sbz-arm{animation:sbzArmL .92s ease-in-out infinite}
  .sbz-armL{transform-origin:122px 302px}
  .sbz-armR{transform-origin:298px 302px;animation-name:sbzArmR}
  @keyframes sbzArmL{
    0%,100%{transform:rotate(-10deg)}
    50%{transform:rotate(138deg)}}
  @keyframes sbzArmR{
    0%,100%{transform:rotate(-138deg)}
    50%{transform:rotate(10deg)}}

  .sbz-legL{transform-origin:180px 348px;animation:sbzKickL .92s ease-in-out infinite}
  .sbz-legR{transform-origin:240px 348px;animation:sbzKickR .92s ease-in-out infinite}
  @keyframes sbzKickL{
    0%,100%{transform:rotate(0)}
    25%{transform:rotate(34deg) translateY(-12px)}
    50%{transform:rotate(0)}}
  @keyframes sbzKickR{
    0%,50%,100%{transform:rotate(0)}
    75%{transform:rotate(-34deg) translateY(-12px)}}

  .sbz-tie{transform-origin:210px 295px;animation:sbzTie .46s ease-in-out infinite alternate}
  @keyframes sbzTie{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

  .sbz-eye{animation:sbzBlink 3.7s infinite}
  .sbz-eyeL{transform-origin:178px 140px}
  .sbz-eyeR{transform-origin:242px 140px;animation-delay:.05s}
  @keyframes sbzBlink{
    0%,91%,97%,100%{transform:scaleY(1)}
    94%{transform:scaleY(.06)}}

  .sbz-pupil{animation:sbzLook 3.68s ease-in-out infinite}
  @keyframes sbzLook{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}}

  .sbz-nose{transform-origin:210px 168px;animation:sbzNose .46s ease-in-out infinite alternate}
  @keyframes sbzNose{from{transform:rotate(-4deg) scaleY(1.05)}to{transform:rotate(4deg) scaleY(.95)}}

  .sbz-teeth{transform-origin:210px 224px;animation:sbzTeeth .46s ease-in-out infinite alternate}
  @keyframes sbzTeeth{from{transform:scaleY(1)}to{transform:scaleY(.88)}}

  /* respect reduced-motion settings */
  @media (prefers-reduced-motion:reduce){
    .sbz-stage *{animation-duration:20s!important}}
</style>
<!-- ============ END SPONGEBOB DANCE PARTY ============ -->
